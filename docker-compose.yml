services:
  mysql:
    image: mysql:8.4
    container_name: management-system-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password_change_me
      MYSQL_DATABASE: management_system
      MYSQL_USER: management_app
      MYSQL_PASSWORD: management_app_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-umanagement_app", "-pmanagement_app_password"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
